name: Atualizar deadlines

on:
  schedule:
    - cron: "17 6 * * *"   # todo dia, ~03:17 em Brasília
  workflow_dispatch:        # permite rodar manualmente na aba Actions
  push:
    branches: [main]
    paths:
      - "data/grupo.yml"
      - "data/extra_conferences.yml"
      - "data/qualis/**"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Gerar data/conferences.json
        run: uv run scripts/build_data.py

      - name: Commit se houver mudanças
        run: |
          if git diff --quiet -- data/conferences.json data/conferences.js; then
            echo "Sem mudanças."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/conferences.json data/conferences.js
          git commit -m "Atualiza deadlines ($(date -u +%Y-%m-%d))"
          git push
